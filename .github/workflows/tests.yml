name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: ["rebuild/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser UI JavaScript syntax
        run: node -e "const fs=require('fs'); const html=fs.readFileSync('website.html','utf8'); const scripts=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)]; if (!scripts.length) throw new Error('No inline script found'); scripts.forEach((s)=>new Function(s[1]));"
